# Routing adapter for the toothpaste quiz and calculator (mcbridgeee/is373-ci-cd).
# One container serves both: quiz.bmctiernan.com and calc.bmctiernan.com.
#
# Copy into the QUIZ checkout on the droplet as compose.override.yaml (that
# repo ignores it). Its Make commands load it on every operation. This file
# only connects the quiz's prod container to the Traefik that already runs
# here: it starts no second proxy and publishes no host ports.
services:
  prod:
    networks:
      - default
      - hosting
    labels:
      traefik.enable: "true"
      # prod is on two networks; tell Traefik which one it can reach.
      traefik.docker.network: ${TRAEFIK_NETWORK:-hosting-web}
      traefik.http.routers.quiz.rule: Host(`${APP_HOST:?Set APP_HOST in the quiz checkout's .env}`)
      # websecure already has the Let's Encrypt resolver; web already redirects to HTTPS.
      traefik.http.routers.quiz.entrypoints: websecure
      traefik.http.routers.quiz.middlewares: quiz-ratelimit,quiz-headers
      traefik.http.routers.quiz.service: quiz
      traefik.http.services.quiz.loadbalancer.server.port: "8000"
      # The calculator: same container and service, its own hostname. Visitors to
      # calc.bmctiernan.com/ get the page the app serves at /calc; the page's
      # /api/calculate and /health requests pass through unchanged.
      traefik.http.routers.calc.rule: Host(`${CALC_HOST:-calc.bmctiernan.com}`)
      traefik.http.routers.calc.entrypoints: websecure
      traefik.http.routers.calc.middlewares: calc-root,quiz-ratelimit,quiz-headers
      traefik.http.routers.calc.service: quiz
      traefik.http.middlewares.calc-root.replacepathregex.regex: "^/$$"
      traefik.http.middlewares.calc-root.replacepathregex.replacement: "/calc"
      # HSTS: browsers refuse plain HTTP for this host for a year. Only the TLS
      # terminator can send it honestly. No preload, no subdomains.
      traefik.http.middlewares.quiz-headers.headers.stsSeconds: "31536000"
      # Don't advertise the proxy.
      traefik.http.middlewares.quiz-headers.headers.customResponseHeaders.Server: ""
      # Rate limit per client IP: past the burst, Traefik answers 429 Too Many
      # Requests. Loose on purpose: a whole classroom shares one public IP, and a
      # page load is about 3 requests. A script flooding the site still trips it,
      # and fail2ban (security/) bans IPs that keep going after their 429s.
      traefik.http.middlewares.quiz-ratelimit.ratelimit.average: "50"
      traefik.http.middlewares.quiz-ratelimit.ratelimit.burst: "100"

networks:
  hosting:
    # Must already exist (created by the hosting stack); a typo fails loudly.
    external: true
    name: ${TRAEFIK_NETWORK:-hosting-web}
