# Install to /etc/ssh/sshd_config.d/10-server-of-love.conf (see security/README.md).
# sshd keeps the FIRST value it reads, and files load in name order, so "10-"
# wins over the 50-cloud-init.conf that DigitalOcean images ship with.

# Keys only: no password guessing at all.
PasswordAuthentication no
KbdInteractiveAuthentication no
# root may still log in, but only with a key (DigitalOcean droplets often use root).
PermitRootLogin prohibit-password
# Fewer guesses per connection; fail2ban's sshd jail bans repeat offenders.
MaxAuthTries 3
