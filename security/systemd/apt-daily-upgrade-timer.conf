# Install to /etc/systemd/system/apt-daily-upgrade.timer.d/server-of-love.conf
# Run unattended-upgrades (security updates) every night at 2:00 exactly.
# The empty OnCalendar= clears Ubuntu's default 6am-plus-random schedule first.
# Persistent=true: if the droplet was off at 2:00, run as soon as it's back.
[Timer]
OnCalendar=
OnCalendar=*-*-* 02:00
RandomizedDelaySec=0
Persistent=true
