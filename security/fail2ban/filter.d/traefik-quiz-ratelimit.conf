# Matches Traefik access-log lines for the quiz router that were answered with
# 429 Too Many Requests (the rate limit in integrations/quiz/).
#
# Traefik logs to stdout, so the lines live in Docker's JSON log file with the
# inner quotes escaped, for example:
# {"log":"203.0.113.7 - - [05/Oct/2026:16:57:18 +0000] \"GET /health HTTP/2.0\" 429 17 \"-\" \"-\" 154 \"quiz@docker\" \"-\" 0ms\n",...}
# fail2ban's default date detection reads the [05/Oct/2026:...] timestamp.

[Definition]
failregex = ^\{"log":"<HOST> - \S+ .*\\"[A-Z]+ [^"\\]* HTTP/[0-9.]+\\" 429 \d+ .*\\"quiz@docker\\"
ignoreregex =
